services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to point at the postgres service below instead of SQLite.
      DATABASE_URL: postgresql+psycopg2://bazaarsync:bazaarsync@db:5432/bazaarsync
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bazaarsync
      POSTGRES_PASSWORD: bazaarsync
      POSTGRES_DB: bazaarsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
